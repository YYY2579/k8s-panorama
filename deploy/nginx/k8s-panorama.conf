# K8s Panorama —— nginx 反向代理配置
# 用法：
#   sudo cp deploy/nginx/k8s-panorama.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前置条件：nginx 已安装；域名已解析到本机；后端已在 127.0.0.1:8000 监听。
# 注意：本项目本身无鉴权，请按需启用下面的 IP 白名单或 Basic Auth。

upstream k8s_panorama {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name atlas.example.com;          # TODO: 改成你的域名

    # 导入 JSON 的请求体可能较大
    client_max_body_size 10m;

    access_log /var/log/nginx/k8s-panorama.access.log;
    error_log  /var/log/nginx/k8s-panorama.error.log;

    location / {
        proxy_pass         http://k8s_panorama;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 健康检查单独路径，便于监控探针（不写访问日志）
    location = /api/health {
        proxy_pass       http://k8s_panorama/api/health;
        access_log       off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

