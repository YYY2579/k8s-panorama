name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Unit tests (pytest)
        run: pytest backend/tests -q

      - name: Start backend
        env:
          ATLAS_ADMIN_PASSWORD: ci-test-password-123
          ATLAS_SEED: "1"
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/atlas.log 2>&1 &
          # 等 health 就绪，最多 30s
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "backend ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/health || (echo "backend failed to start"; cat /tmp/atlas.log; exit 1)

      - name: End-to-end API tests
        env:
          ATLAS_ADMIN_PASSWORD: ci-test-password-123
        run: python scripts/test_api.py

      - name: Upload backend log on failure
        if: failure()
        run: cat /tmp/atlas.log || true
